<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">
        <aside class="sidebar">
            <div class="logo">
                <div class="logo-icon">AI</div>
                <span>My AI</span>
                <button class="menu-btn">☰</button>
            </div>
            <button class="create-btn">
                <span>＋</span> Create
            </button>
            <nav>
                <a href="#" class="active">
                    <span>⌂</span> Explore
                </a>

                <a href="#">
                    <span>🤖</span> Bots & Apps
                </a>
                
                <a href="#">
                    <span>▣</span> Projects
                </a>

                <a href="#">
                    <span>🏆</span> Leaderboard
                </a>

                <a href="#">
                    <span>✦</span> Creators
                </a>

                <a href="#">
                    <span>👤</span> Profile
                </a>

                <a href="#">
                    <span>⚙</span> Settings
                </a>

                <a href="#">
                    <span>↗</span> Send Feedback
                </a>

                <a href="#">
                    <span>?</span>Support
                </a>
            </nav>
        </aside>
            <main class="main">
                <header class="topbar">
                    <div class="search">
                        🔍
                        <input type="text" placeholder="Search Here">
                    </div>

                    <button class="space-btn">
                        + Space
                    </button>

                    <div class="profile">
                        <div class="notification">♡</div>
                        <div class="notification">◫</div>
                        <div class="avatar">N</div>
                        <div>
                            <strong>NextGenCoders</strong>
                            <small>Pro Member</small>
                        </div>
                    </div>
                </header>
                <section class="content">
                    <div class="welcome">
                        <div class="ai-orb">
                            ✦
                        </div>
                        <h1>Welcome To</h1>
                        <p>Complaint Management System Of SwiftCraft</p>
                    </div>

                    <div class="tools">
                        <div class="tool active-tool">
                            <div>💬</div>
                            <span>Chat</span>
                        </div>

                        <div class="tool">
                            <div>✓</div>
                            <span>Tasks</span>
                        </div>

                        <div class="tool">
                            <div>✦</div>
                            <span>Design</span>
                        </div>

                        <div class="tool">
                            <div>⌘</div>
                            <span>Code</span>
                        </div>

                        <div class="tool">
                            <div>🔬</div>
                            <span>Research</span>
                        </div>

                        <div class="tool">
                            <div>🖊</div>
                            <span>Writing</span>
                        </div>
                    </div>

                    <div class="chat-box">

                        <div class="chat-top">
                            <span>✦ Unlock More With Pro Plan</span>
                        </div>

                        <textarea class="textarea"
                            placeholder="Reports Your Complaints Here"
                            ></textarea>
                        
                        <div class="chat-options">
                            <div>
                                <button>Deep Research</button>
                                <button>Make An Image</button>
                                <button>Search</button>
                            </div>

                            <div class="chat-actions">
                                🎤
                                <button class="send">➤</button>
                            </div>
                        </div>    
                    </div>
                </section>
            </main>
    </div>
</body>
</html>
